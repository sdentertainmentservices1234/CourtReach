name: Sync SD-Chamber day sheet into CourtReach

# Mirrors ONE organisation's day sheet (SD-Chamber) into its CourtReach shared
# board. Two separate Firebase projects, two separate Auth systems — a browser
# session in one is meaningless in the other — so this runs server-side with
# an admin key for each project. See sync_daysheet.py and DAYSHEET-SYNC-SETUP.md.
#
# SIX FIXED TIMES A DAY, not an interval (owner: "I dont want it every minute,
# 10 minute, 20 minute or 30 minute. I want it to be scheduled for 8 am, 10.25
# am, 6pm, 8pm, 10pm, and 11.59 pm everyday. Thats it").
#
# This used to poll every 10 minutes, 96 runs a day — about 2,880 GitHub Actions
# runs a month on its own, three quarters of everything this account ran, and it
# woke up on a timer whether or not a clerk had touched anything. The six times
# below are the moments a day sheet actually changes: morning prep, a last look
# before the court sits at 10.30, then the evening passes as tomorrow's sheet is
# built up, and a final sweep at end of day.
#
# GitHub cron is UTC and India does not observe daylight saving, so IST is always
# UTC + 5:30 and these never drift:
#     02:30 UTC = 08:00 IST      12:30 UTC = 18:00 IST
#     04:55 UTC = 10:25 IST      14:30 UTC = 20:00 IST
#     16:30 UTC = 22:00 IST      18:29 UTC = 23:59 IST
#
# One caveat that matters MORE now than it did at 96 runs a day: GitHub delays or
# silently drops scheduled runs when its queues are busy, and it is worst on the
# hour. A missed run out of 96 was invisible; a missed run out of 6 leaves the
# board stale until the next slot. The :30 and :55 offsets avoid the busiest
# marks, and "Run workflow" on the Actions tab syncs on demand whenever a sheet
# changes off-schedule.
on:
  schedule:
    - cron: "30 2 * * *"        # 08:00 IST — morning prep
    - cron: "55 4 * * *"        # 10:25 IST — last look before the court sits
    - cron: "30 12 * * *"       # 18:00 IST
    - cron: "30 14 * * *"       # 20:00 IST
    - cron: "30 16 * * *"       # 22:00 IST
    - cron: "29 18 * * *"       # 23:59 IST — end of day
  workflow_dispatch:             # manual "Run workflow" button

# Never let two runs overlap.
concurrency:
  group: daysheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip entirely (rather than fail loudly on every scheduled tick) until the
    # required secrets have actually been added — see DAYSHEET-SYNC-SETUP.md.
    if: ${{ vars.DAYSHEET_SYNC_ENABLED == 'true' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install firebase-admin
        run: pip install firebase-admin
      - uses: actions/checkout@v4
      - name: Sync day sheet → CourtReach board
        env:
          SD_CHAMBER_SA_KEY: ${{ secrets.SD_CHAMBER_SA_KEY }}
          COURTREACH_SA_KEY: ${{ secrets.COURTREACH_SA_KEY }}
          COURTREACH_ORG_UID: ${{ secrets.COURTREACH_ORG_UID }}
        run: python sync_daysheet.py
